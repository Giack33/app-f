/* ---------- ÉCHÉANCES ---------- */
// Toutes les dates où une charge tombe entre deux bornes, quelle que soit sa fréquence.
function echeances(r, debut, fin){
  const out=[], pas=12/(PAR_AN[r.frequence]||12);
  if(r.date_fin){ const f=new Date(r.date_fin+'T00:00:00'); if(f<fin) fin=f; if(fin<debut) return out; }
  if(r.frequence==='hebdomadaire'){
    let d=new Date(debut);
    while(d<=fin){ out.push(new Date(d)); d.setDate(d.getDate()+7) }
    return out;
  }
  if(r.frequence==='mensuel'){
    const j=r.jour_prelevement||1;
    let d=new Date(debut.getFullYear(),debut.getMonth(),1);
    while(d<=fin){
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const date=new Date(d.getFullYear(),d.getMonth(),Math.min(j,dim));
      if(date>=debut && date<=fin) out.push(date);
      d.setMonth(d.getMonth()+1);
    }
    return out;
  }
  // bimestriel / trimestriel / semestriel / annuel : on part de la prochaine échéance connue
  if(!r.prochaine_echeance) return out;
  let d=new Date(r.prochaine_echeance+'T00:00:00');
  while(d<debut){ d.setMonth(d.getMonth()+pas) }
  while(d<=fin){ out.push(new Date(d)); d.setMonth(d.getMonth()+pas) }
  return out;
}

/* ---------- VIREMENTS INTERNES ---------- */
// Un virement d'un compte du foyer vers un autre n'est ni une depense ni un revenu :
// c'est le meme argent qui change de poche. On apparie chaque debit avec un credit
// du meme montant sur un autre compte, a 4 jours pres, puis on neutralise les deux.
function marquerVirementsInternes(){
  D.tx.forEach(t=>{ t.interne=false });
  const credits={};
  D.tx.filter(t=>Number(t.montant)>0).forEach(t=>{
    const k=Number(t.montant).toFixed(2); (credits[k]=credits[k]||[]).push(t);
  });
  D.tx.filter(t=>Number(t.montant)<0).forEach(d=>{
    const lot=credits[Math.abs(Number(d.montant)).toFixed(2)]; if(!lot) return;
    const dd=new Date(d.date_operation+'T00:00:00');
    const c=lot.find(x=>!x.interne && x.account_id!==d.account_id
      && Math.abs(new Date(x.date_operation+'T00:00:00')-dd)<=4*864e5);
    if(c){ d.interne=true; c.interne=true }
  });
}

/* ---------- ENTREES ATTENDUES ---------- */
// Cle de regroupement d'un credit : on ne garde que le nom de l'emetteur,
// debarrasse des numeros de virement et du jargon bancaire.
function cleEntree(t){
  const s=(t.contrepartie||t.libelle||'').toUpperCase()
    .replace(/REF\s*:.*$/,' ').replace(/MOTIF.*$/,' ')
    .replace(/[0-9]+/g,' ')
    .replace(/\bVIR(EMENT)?\b|\bINST(ANTANE)?\b|\bEUROPEEN\b|\bPERM\b|\bRECU\b|\bEMIS\b|\bLOGITEL\b|\bWERO\b|\bDE\s*:|\bPOUR\s*:/g,' ')
    .replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  return s.split(' ').filter(w=>w.length>1).slice(0,3).join(' ');
}
function nomEntree(k){
  if(/GENERALI/.test(k)) return 'Salaire Generali';
  return k.split(' ').map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
}
// Un emetteur qui verse au moins 2 mois sur les 6 derniers, et encore recemment, est
// considere comme recurrent. On ne retient qu'un versement par mois (le plus gros : le
// salaire, pas le petit remboursement du meme emetteur), puis on moyenne les 3 derniers.
function entreesRecurrentes(){
  const now=new Date(), limite=new Date(now.getFullYear(),now.getMonth()-5,1);
  const grp={};
  D.tx.forEach(t=>{
    const v=Number(t.montant);
    if(v<=0 || t.interne || t.statut==='ignoree') return;
    if(v<150) return;                                  // on laisse de cote les petits remboursements
    const d=new Date(t.date_operation+'T00:00:00'); if(d<limite) return;
    const k=cleEntree(t); if(!k) return;
    const km=d.getFullYear()+'-'+d.getMonth();
    const g=grp[k]=grp[k]||{};
    if(!g[km] || v>g[km].montant) g[km]={montant:v,d};
  });
  const out=[];
  Object.entries(grp).forEach(([k,parMoisK])=>{
    const lot=Object.values(parMoisK).sort((a,b)=>b.d-a.d);
    if(lot.length<2) return;                           // pas assez regulier pour etre projete
    if((now-lot[0].d)>50*864e5) return;                // tari depuis plus d'un mois et demi : on n'extrapole pas
    const der=lot.slice(0,3);
    const jours=der.map(x=>x.d.getDate()).sort((a,b)=>a-b);
    out.push({nom:nomEntree(k),
              montant:Math.round(der.reduce((s,x)=>s+x.montant,0)/der.length*100)/100,
              jour:jours[Math.floor(jours.length/2)], dernier:lot[0].d});
  });
  return out.sort((a,b)=>b.montant-a.montant);
}
// Projette ces entrees sur la periode demandee, sans redoubler une entree
// deja encaissee dans le mois concerne.
function entreesPrevues(debut,fin){
  const out=[], rec=entreesRecurrentes();
  const poser=(nom,montant,jour,dejaVu)=>{
    let d=new Date(debut.getFullYear(),debut.getMonth(),1);
    while(d<=fin){
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const date=new Date(d.getFullYear(),d.getMonth(),Math.min(jour,dim));
      if(date>=debut && date<=fin && !dejaVu(date)) out.push({nom,montant,date,estime:true});
      d.setMonth(d.getMonth()+1);
    }
  };
  rec.forEach(r=>poser(r.nom,r.montant,r.jour,
    date=>r.dernier.getFullYear()===date.getFullYear() && r.dernier.getMonth()===date.getMonth()));

  // Filet de securite : le salaire Generali, si l'historique des credits ne l'a pas encore vu
  // (il arrive le 25 a un jour pres, pour un montant variable selon les commissions).
  if(!rec.some(r=>/generali/i.test(r.nom))){
    const sal=D.inc.filter(i=>/salaire/i.test(i.source||'')).slice(0,3);
    if(sal.length){
      const montant=Math.round(sal.reduce((s,i)=>s+Number(i.montant_net),0)/sal.length*100)/100;
      poser('Salaire Generali (estime)',montant,Number(D.set.jour_rappel_paie||25),
        date=>D.inc.some(i=>/salaire/i.test(i.source||'') && String(i.mois).slice(0,7)===
          date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')));
    }
  }
  return out.sort((a,b)=>a.date-b.date);
}

/* ---------- MOTEUR DE CALCUL ---------- */
function moteur(){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth(), today=now.getDate();
  const aujourdhui=new Date(Y,M,today);
  const finMois=new Date(Y,M+1,0);
  const joursRestants=finMois.getDate()-today+1;
  const HORIZON=joursRestants;                       // on projette jusqu'a la fin du mois en cours
  const fin=new Date(Y,M,today+HORIZON-1);

  const courants=D.acc.filter(a=>a.type==='courant'&&!a.exclu_budget);
  const solde=courants.reduce((s,a)=>s+Number(a.solde),0);
  // on sépare ce qui est rattaché au foyer (commun) de ce qui ne l'est pas (perso)
  const comptesCommuns=courants.filter(a=>a.foyer_id), comptesPersos=courants.filter(a=>!a.foyer_id);
  const soldeCommun=comptesCommuns.reduce((s,a)=>s+Number(a.solde),0);
  const soldePerso=comptesPersos.reduce((s,a)=>s+Number(a.solde),0);

  // ce qui tombe encore d'ici la fin du mois, toutes fréquences confondues
  const aVenir=[];
  D.rec.forEach(r=>echeances(r,aujourdhui,fin).forEach(d=>aVenir.push({nom:r.nom,montant:Number(r.montant),date:d,abo:r.est_abonnement,freq:r.frequence})));
  D.docs.forEach(x=>{
    if(!x.montant) return;
    const d=x.date_echeance?new Date(x.date_echeance+'T00:00:00'):null;
    if(d && d>=aujourdhui && d<=fin) aVenir.push({nom:x.fournisseur||'Facture',montant:Number(x.montant),date:d,facture:true});
  });
  aVenir.sort((a,b)=>a.date-b.date);
  const totalAVenir=aVenir.reduce((s,x)=>s+x.montant,0);
  const aVenirMois=aVenir.filter(x=>x.date<=finMois);
  const totalAVenirMois=aVenirMois.reduce((s,x)=>s+x.montant,0);

  // frais pro declares : virement Generali attendu, pas encore rapproche
  const proPrevus=(D.pro||[]).filter(p=>p.statut==='declare'&&p.montant&&p.date_virement_prevue)
    .map(p=>({mois:p.mois,montant:Number(p.montant),date:new Date(p.date_virement_prevue+'T00:00:00')}))
    .sort((a,b)=>a.date-b.date);
  const totalProPrevu=proPrevus.reduce((s,x)=>s+x.montant,0);
  const proRecu=(D.pro||[]).find(p=>p.statut==='recu'&&!p.date_virement_n26);

  // épargne du mois pas encore mise de côté
  const objEp=Number(D.set.objectif_epargne_mensuel||0);
  const dejaEp=D.tx.filter(t=>{
    const c=D.catById[t.category_id], dt=new Date(t.date_operation+'T00:00:00');
    return c && c.type==='epargne' && dt.getFullYear()===Y && dt.getMonth()===M;
  }).reduce((s,t)=>s+Math.abs(Number(t.montant)),0);
  const epRestante=Math.max(0,objEp-dejaEp);

  // Entrees attendues : salaire, apport du conjoint. Les frais pro Generali sont
  // volontairement exclus de tout calcul : ils transitent par le compte N26, isole du dashboard.
  const inflows=[...entreesPrevues(aujourdhui,fin)]
                .filter(e=>e.date>aujourdhui && e.date<=fin)
                .sort((a,b)=>a.date-b.date);
  const totalEntrees=inflows.reduce((s,e)=>s+e.montant,0);
  const prochaine=inflows[0]||null;

  // Le reste a vivre se compte jusqu'a la prochaine entree d'argent, pas jusqu'au 31.
  const borne=prochaine?prochaine.date:finMois;
  const joursAvantEntree=Math.max(1,Math.round((borne-aujourdhui)/864e5));
  const sortiesAvantEntree=aVenir.filter(x=>x.date<=borne).reduce((s,x)=>s+x.montant,0);
  const reste=solde-sortiesAvantEntree;
  const hebdo=reste/(joursAvantEntree/7);
  const parJour=reste/joursAvantEntree;

  const so=Number(D.set.seuil_orange??200), sr=Number(D.set.seuil_rouge??50);
  let couleur='var(--green)', verdict='Tu peux dépenser';
  if(reste<sr){couleur='var(--red)'; verdict="C'est chaud — on serre"}
  else if(reste<so){couleur='var(--orange)'; verdict='Prudence cette semaine'}

  // dépenses par catégorie, ce mois-ci et le mois dernier
  const pm=new Date(Y,M-1,1);
  const parCat={}, parCatPrec={};
  let depMois=0;
  D.tx.forEach(t=>{
    if(Number(t.montant)>=0 || t.statut==='ignoree' || t.interne) return;
    const dt=new Date(t.date_operation+'T00:00:00');
    const nom=D.catById[t.category_id]?.nom||'Non classé', v=Math.abs(Number(t.montant));
    if(dt.getFullYear()===Y && dt.getMonth()===M){ parCat[nom]=(parCat[nom]||0)+v; depMois+=v }
    else if(dt.getFullYear()===pm.getFullYear() && dt.getMonth()===pm.getMonth()){ parCatPrec[nom]=(parCatPrec[nom]||0)+v }
  });

  // revenu mensuel moyen, calculé par mois puis moyenné
  const parMoisRev={};
  D.inc.filter(i=>!i.hors_budget).forEach(i=>{ parMoisRev[i.mois]=(parMoisRev[i.mois]||0)+Number(i.montant_net) });
  const moisTries=Object.keys(parMoisRev).sort().reverse().slice(0,3);
  const revMoy=moisTries.length?moisTries.reduce((s,k)=>s+parMoisRev[k],0)/moisTries.length:0;

  // projection jour par jour jusqu'à la fin du mois seulement.
  // Aucun salaire futur n'est injecté : il est variable, donc inconnu tant qu'il n'est pas saisi.
  const sorties={}, detail={};
  aVenir.forEach(x=>{
    if(x.date<aujourdhui) return;
    const k=x.date.toDateString();
    sorties[k]=(sorties[k]||0)+x.montant;
    (detail[k]=detail[k]||[]).push(x.nom);
  });
  const entrees={}, detailIn={};
  inflows.forEach(p=>{ const k=p.date.toDateString(); entrees[k]=(entrees[k]||0)+p.montant; (detailIn[k]=detailIn[k]||[]).push(p.nom) });
  const quotidien=parJourMoyen();
  const proj=[]; let bal=solde;
  for(let k=0;k<HORIZON;k++){
    const d=new Date(Y,M,today+k);
    const key=d.toDateString();
    if(k>0){
      bal-=sorties[key]||0;
      bal+=entrees[key]||0;
      bal-=quotidien;
    }else{
      bal-=sorties[key]||0;   // charge tombant aujourd'hui : deduite aussi du reste a vivre, pas de train de vie au jour 0
    }
    proj.push({d,bal,out:sorties[key]||0,inn:entrees[key]||0,noms:detail[key]||[],nomsIn:detailIn[key]||[]});
  }
  const finMoisBal=proj.length?proj[Math.min(joursRestants-1,proj.length-1)].bal:solde;
  const finHorizonBal=proj.length?proj[proj.length-1].bal:solde;
  const negPrevu=proj.find(x=>x.bal<0)||null;

  return {solde,soldeCommun,soldePerso,comptesCommuns,comptesPersos,totalAVenir,epRestante,reste,hebdo,parJour,couleur,verdict,joursRestants,finMois,finMoisBal,
          HORIZON,fin,finHorizonBal,inflows,totalEntrees,prochaine,joursAvantEntree,aVenirMois,totalAVenirMois,negPrevu,
          parCat,parCatPrec,depMois,proj,aVenir,revMoy,quotidien,proPrevus,totalProPrevu,proRecu,
          aValider:D.tx.filter(t=>t.statut==='a_valider'),
          abos:D.rec.filter(r=>r.est_abonnement),
          chargesMois:D.rec.reduce((s,r)=>s+parMois(r),0)};
}
/* ---------- A PREVOIR POUR LE MOIS PROCHAIN ---------- */
// Seules les depenses contraintes sont provisionnees. Resto, loisirs, shopping, Pokemon
// dependent de ce qu'il reste ; la sante n'est pas previsible. Ils ne sont pas provisionnes.
const CATS_VARIABLES=['Courses','Tabac','Transport & carburant','Péages'];
const EDF_INDEX=1.03;   // indexation appliquee a la conso de l'an dernier

function normCat(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
const CATS_VAR_N=CATS_VARIABLES.map(normCat);

// Conso EDF du meme mois l'an dernier, indexee.
function edfConso(d){
  const k=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const e=(D.edf||[]).find(x=>String(x.mois).slice(0,10)===k);
  return e?Number(e.montant)*EDF_INDEX:null;
}
// Un prelevement EDF couvre les deux mois de conso qui le precedent.
function edfEstime(d){
  const a=new Date(d.getFullYear(),d.getMonth()-2,1), b=new Date(d.getFullYear(),d.getMonth()-1,1);
  const va=edfConso(a), vb=edfConso(b);
  if(va===null||vb===null) return null;
  const f=x=>x.toLocaleDateString('fr-FR',{month:'short'});
  return {montant:Math.round((va+vb)*100)/100,
          note:`estime sur la conso ${f(a)} + ${f(b)} de l'an dernier, +${Math.round((EDF_INDEX-1)*100)} %`};
}

// Moyenne mensuelle des depenses contraintes sur les 3 derniers mois complets.
function variablesMoyennes(){
  const now=new Date(), mois=[1,2,3].map(k=>new Date(now.getFullYear(),now.getMonth()-k,1));
  const cles=new Set(mois.map(d=>d.getFullYear()+'-'+d.getMonth()));
  const detail={};
  D.tx.forEach(t=>{
    if(Number(t.montant)>=0||t.statut==='ignoree'||t.interne) return;
    const nom=D.catById[t.category_id]?.nom;
    if(!nom || CATS_VAR_N.indexOf(normCat(nom))<0) return;
    const d=new Date(t.date_operation+'T00:00:00');
    if(!cles.has(d.getFullYear()+'-'+d.getMonth())) return;
    detail[nom]=(detail[nom]||0)+Math.abs(Number(t.montant));
  });
  const n=mois.length;
  return {parCat:Object.entries(detail).map(([nom,v])=>({nom,montant:Math.round(v/n*100)/100})).sort((a,b)=>b.montant-a.montant),
          mois:mois.map(d=>d.toLocaleDateString('fr-FR',{month:'short'})).reverse()};
}

// Tout ce qu'il faudra sortir le mois prochain, du 1er au dernier jour.
function aPrevoir(){
  const now=new Date();
  const debut=new Date(now.getFullYear(),now.getMonth()+1,1);
  const fin=new Date(now.getFullYear(),now.getMonth()+2,0);
  const lignes=[];

  D.rec.forEach(r=>{
    const estEDF=/\bedf\b/i.test(r.nom);
    echeances(r,debut,fin).forEach(d=>{
      let montant=Number(r.montant), note=null;
      if(estEDF){
        const e=edfEstime(d);
        if(e){ montant=e.montant; note=e.note }
        else note='montant du dernier prelevement : historique de conso incomplet';
      }
      lignes.push({nom:r.nom,montant,date:d,type:'fixe',note,abo:r.est_abonnement});
    });
  });

  // Pas d'objectif d'epargne ici : il ferait doublon avec le versement PER,
  // deja compte parmi les charges fixes.

  const dimF=fin.getDate();
  abosDetectes().forEach(a=>lignes.push({nom:a.nom,montant:a.montant,type:'abo_detecte',
    date:new Date(debut.getFullYear(),debut.getMonth(),Math.min(a.jour,dimF)),
    note:`detecte, pas encore declare · ${a.mois} mois d'affilee`}));

  const v=variablesMoyennes();
  v.parCat.forEach(c=>lignes.push({nom:c.nom,montant:c.montant,type:'variable',
    note:`moyenne ${v.mois.join(' / ')}`}));

  lignes.sort((a,b)=>(a.date&&b.date)?a.date-b.date:(a.date?-1:(b.date?1:b.montant-a.montant)));
  const par=t=>lignes.filter(x=>x.type===t).reduce((s,x)=>s+x.montant,0);
  return {debut,fin,lignes,total:lignes.reduce((s,x)=>s+x.montant,0),
          fixes:par('fixe'),abosDet:par('abo_detecte'),variables:par('variable'),
          nomMois:debut.toLocaleDateString('fr-FR',{month:'long'})};
}

function parJourMoyen(){
  const d30=D.tx.filter(t=>Number(t.montant)<0 && t.statut!=='ignoree' && !t.interne
    && (Date.now()-new Date(t.date_operation+'T00:00:00'))<30*864e5
    && !depenseNeutre(t));
  return d30.length?d30.reduce((s,t)=>s+Math.abs(Number(t.montant)),0)/30:0;
}
// Ni train de vie, ni dépense reelle : les charges fixes (deja projetees a leur date),
// l'epargne (mise de cote, pas depensee), les frais pro (rembourses) et les transferts internes.
function depenseNeutre(t){
  const c=D.catById[t.category_id];
  if(!c) return false;
  return c.type==='fixe' || c.type==='epargne' || /transfert|frais pro/i.test(c.nom||'');
}

/* ---------- ABONNEMENTS NON DECLARES ---------- */
// Un meme commercant preleve a peu pres le meme montant, environ une fois par mois,
// sur au moins 3 mois, et encore recemment : c'est un abonnement qui s'ignore.
function sansAccent(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase()}
function cleDebit(t){
  return sansAccent(t.contrepartie||t.libelle||'')
    .replace(/CARTE\s+X?\d*/g,' ')
    .replace(/REF\s*:.*$/,' ').replace(/MOTIF.*$/,' ')
    .replace(/[0-9]+/g,' ')
    .replace(/\b(PRELEVEMENT|EUROPEEN|LOGITEL|WERO|PERM|EUR|USD|CHF|IRL|LUX|PAYS|BAS|COMMERCE|ELECTRONIQUE|ELECTR|PAIEMENT|PENDING|SARL|SAS|SASU|FRANCE|FRA|COM|WWW|INST|INSTANTANE|VIR|VIREMENT|EMIS|RECU)\b/g,' ')
    .replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim()
    .split(' ').filter((w,i,a)=>w.length>2 && !/^(.)\1+$/.test(w) && a.indexOf(w)===i).slice(0,3).join(' ');
}
function abosIgnores(){ try{return JSON.parse(localStorage.getItem('abosIgnores')||'[]')}catch(e){return []} }
function ignorerAbo(k){ const l=abosIgnores(); if(!l.includes(k)) l.push(k); localStorage.setItem('abosIgnores',JSON.stringify(l)); render(); }
function abosDetectes(){
  const now=new Date(), limite=new Date(now.getFullYear(),now.getMonth()-5,1);
  const dejaNoms=D.rec.map(r=>sansAccent(r.nom).split(/[^A-Z]+/).filter(w=>w.length>2));
  const dejaMontants=D.rec.map(r=>Math.abs(Number(r.montant)));
  const ignores=abosIgnores();
  const grp={};
  D.tx.forEach(t=>{
    const v=-Number(t.montant);
    if(v<=1 || v>250 || t.interne || t.statut==='ignoree' || t.recurring_charge_id) return;
    const d=new Date(t.date_operation+'T00:00:00'); if(d<limite) return;
    const k=cleDebit(t); if(!k || k.length<4) return;
    (grp[k]=grp[k]||[]).push({v,d});
  });
  const out=[];
  Object.entries(grp).forEach(([k,lot])=>{
    const mois=new Set(lot.map(x=>x.d.getFullYear()+'-'+x.d.getMonth()));
    if(mois.size<3) return;                              // pas assez regulier
    if(lot.length>mois.size*1.4) return;                 // plusieurs fois par mois : du courant, pas un abonnement
    const dernier=lot.reduce((a,b)=>b.d>a.d?b:a).d;
    if((now-dernier)>45*864e5) return;                   // arrete : rien a signaler
    const moy=lot.reduce((s,x)=>s+x.v,0)/lot.length;
    const ecart=Math.sqrt(lot.reduce((s,x)=>s+(x.v-moy)**2,0)/lot.length);
    if(ecart>Math.max(1,moy*0.12)) return;               // montant trop instable
    if(ignores.includes(k)) return;
    const mots=k.split(' ');
    if(dejaNoms.some(n=>n.some(w=>mots.includes(w)))) return;   // deja declaree, par le nom
    if(dejaMontants.some(x=>Math.abs(x-moy)<0.05)) return;      // deja declaree, par le montant
    const jours=lot.map(x=>x.d.getDate()).sort((a,b)=>a-b);
    out.push({cle:k, nom:k.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' '),
              montant:Math.round(moy*100)/100, jour:jours[Math.floor(jours.length/2)],
              mois:mois.size, dernier});
  });
  return out.sort((a,b)=>b.montant-a.montant);
}

        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <div class="t">${esc(n)}</div><div class="amt">${eur0(v)}</div></div>
        <div class="bar"><i style="width:${Math.max(3,Math.round(v/maxc*100))}%;background:${col}"></i></div>
        <div class="s" style="margin-top:7px">${diff===null?'pas de comparaison':(diff>0?`▲ ${diff} % vs mois dernier`:`▼ ${Math.abs(diff)} % vs mois dernier`)}</div></div>`;
    }).join('')+`</div>` : `<div class="empty">Aucune dépense enregistrée ce mois-ci.</div>`;

  const det=abosDetectes();
  if(m.abos.length||det.length){
    const totAbo=m.abos.reduce((s,a)=>s+parMois(a),0), totDet=det.reduce((s,a)=>s+a.montant,0);
    h+=`<h2>Abonnements <span class="count">${eur0(totAbo+totDet)} / mois</span></h2><div class="list">`;
    h+=m.abos.map(a=>`<div class="row"><div class="ic" style="background:var(--blue-bg);color:var(--blue)">${ic('repeat',18)}</div>
      <div class="mid"><div class="t">${esc(a.nom)}</div>
      <div class="s"${a.fin_essai_gratuit?' style="color:var(--amber)"':''}>${a.fin_essai_gratuit?`essai gratuit jusqu'au ${new Date(a.fin_essai_gratuit+'T00:00:00').toLocaleDateString('fr-FR')}`:`le ${a.jour_prelevement||'?'} ${PERIODE[a.frequence]||''}`}</div></div>
      <div class="amt neg">${eur(-a.montant)}</div></div>`).join('');
    h+=det.map(a=>`<div class="row"><div class="ic" style="background:var(--amber-bg);color:var(--amber)">${ic('quest',18)}</div>
      <div class="mid"><div class="t">${esc(a.nom)}</div>
      <div class="s">environ le ${a.jour} · ${a.mois} mois d'affilée · à confirmer</div></div>
      <div class="amt neg">${eur(-a.montant)}</div>
      <button class="mini ok" onclick='adopterAbo(${JSON.stringify(JSON.stringify(a))})' aria-label="Suivre cette charge">${ic('plus',15)}</button>
      <button class="mini" onclick='ignorerAbo(${JSON.stringify(a.cle)})' aria-label="Ignorer">${ic('x',15)}</button></div>`).join('');
    h+=`</div><div class="note">Soit ${eur0((totAbo+totDet)*12)} sur l'année.${det.length?` Les lignes ambre sont détectées automatiquement : « + » pour les suivre, « ✕ » pour les masquer.`:''}</div>`;
  }
  return h;
}

function drawChart(){
  const m=moteur(), p=m.proj; if(p.length<2) return;
  const W=720,H=252,L=56,R=74,T=26,B=38;
  const vals=p.map(x=>x.bal);
  let mn=Math.min(0,...vals), mx=Math.max(...vals,0);
  if(mx===mn) mx=mn+100;
  const pad=(mx-mn)*0.14; mn-=pad; mx+=pad;
  const n=p.length;
  const step=(W-L-R)/(n-1);
  const X=i=>L+i*step;
  const Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const f1=v=>v.toFixed(1);
  const col=m.couleur, AMB='#F2B84B', COR='#FF8A6B', LIM='#D4F25C', FNT='#6F7882';

  // deux repères horizontaux discrets + échelle
  let gy='';
  [mx,mn].forEach(v=>{
    gy+=`<line x1="${L}" y1="${f1(Y(v))}" x2="${W-R}" y2="${f1(Y(v))}" stroke="#242A32" stroke-width="1"/>
         <text x="${L-8}" y="${f1(Y(v)+3.5)}" fill="${FNT}" font-size="10" font-family="'Geist Mono',monospace" text-anchor="end">${eur0(v)}</text>`;
  });

  // courbe en escalier
  let line=`M${f1(X(0))} ${f1(Y(p[0].bal))}`;
  for(let i=1;i<n;i++) line+=` H${f1(X(i))} V${f1(Y(p[i].bal))}`;
  const base=Y(mn);
  const area=`${line} L${f1(X(n-1))} ${f1(base)} L${f1(X(0))} ${f1(base)} Z`;
  const z=Y(0);
  const neg=p.find(x=>x.bal<0);

  // seuil de prudence
  const so=Number(D.set.seuil_orange??200);
  const ys=Y(so);
  const seuil=(so>mn&&so<mx)?`<line x1="${L}" y1="${f1(ys)}" x2="${W-R}" y2="${f1(ys)}" stroke="${AMB}" stroke-width="1.2" stroke-dasharray="6 5" opacity=".75"/>
    <text x="${W-R-4}" y="${f1(ys-7)}" fill="${AMB}" font-size="10" font-family="'Geist Mono',monospace" text-anchor="end">seuil ${eur0(so)}</text>`:'';

  // marqueurs : entrées nommées + grosses charges
  let marks='';
  const gros=[...p].filter(x=>x.out>0).sort((a,b)=>b.out-a.out).slice(0,3).map(x=>x.d.toDateString());
  p.forEach((x,i)=>{
    const yb=f1(Y(x.bal));
    if(x.inn>0){
      const nom=(x.nomsIn&&x.nomsIn[0])||'entrée';
      const anc=i>n-6?'end':(i<5?'start':'middle');
      marks+=`<line x1="${f1(X(i))}" y1="${yb}" x2="${f1(X(i))}" y2="${H-B}" stroke="${LIM}" stroke-width="1" opacity=".3"/>
        <circle cx="${f1(X(i))}" cy="${yb}" r="3.4" fill="var(--panel)" stroke="${LIM}" stroke-width="2"/>
        <text x="${f1(X(i))}" y="${f1(Math.max(T+10,Y(x.bal)-11))}" fill="${LIM}" font-size="10" font-weight="600" font-family="Geist,sans-serif" text-anchor="${anc}">${esc(String(nom).slice(0,14))}</text>`;
    } else if(x.out>0){
      marks+=`<circle cx="${f1(X(i))}" cy="${yb}" r="2.6" fill="${COR}"/>`;
      if(gros.includes(x.d.toDateString())){
        const anc=i>n-5?'end':(i<4?'start':'middle');
        marks+=`<text x="${f1(X(i))}" y="${f1(Math.min(H-B-6,Y(x.bal)+15))}" fill="${FNT}" font-size="10" font-family="'Geist Mono',monospace" text-anchor="${anc}">−${eur0(x.out)}</text>`;
      }
    }
  });

  // axe des dates
  let lbl='';
  const idx=new Set([0,n-1]);
  const pas=n>35?14:7;
  for(let i=pas;i<n-3;i+=pas) idx.add(i);
  [...idx].sort((a,b)=>a-b).forEach(i=>{
    const anc=i===0?'start':(i===n-1?'end':'middle');
    const txt=i===0?"auj.":p[i].d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace('.','');
    lbl+=`<text x="${f1(X(i))}" y="${H-12}" fill="${FNT}" font-size="10" font-family="'Geist Mono',monospace" text-anchor="${anc}">${txt}</text>`;
  });

  // étiquette de fin de période
  const yEnd=Math.min(H-B-12,Math.max(T+12,Y(p[n-1].bal)));
  const fin=eur0(p[n-1].bal);
  const wBox=Math.max(52,fin.length*7.6);
  const endCol=p[n-1].bal<0?COR:col;

  document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projection du solde">
    ${gy}
    ${z>T&&z<H-B?`<line x1="${L}" y1="${f1(z)}" x2="${W-R}" y2="${f1(z)}" stroke="${COR}" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/>`:''}
    ${seuil}
    <path d="${area}" fill="${col}" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}
    <circle cx="${f1(X(0))}" cy="${f1(Y(p[0].bal))}" r="5.5" fill="var(--panel)" stroke="${col}" stroke-width="2.5"/>
    <text x="${f1(X(0))}" y="${f1(Math.max(T+9,Y(p[0].bal)-13))}" fill="${FNT}" font-size="9.5" font-family="Geist,sans-serif" text-anchor="start" letter-spacing=".8">AUJOURD'HUI</text>
    <circle cx="${f1(X(n-1))}" cy="${f1(Y(p[n-1].bal))}" r="4" fill="${endCol}"/>
    <rect x="${W-R+4}" y="${f1(yEnd-11)}" width="${f1(Math.min(wBox,R-8))}" height="22" rx="7" fill="${endCol}" opacity=".16"/>
    <text x="${W-R+10}" y="${f1(yEnd+4)}" fill="${endCol}" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">${fin}</text>
    ${lbl}</svg>
    <div class="chiplist"><i><b style="background:${col}"></b>solde projeté</i><i><b style="background:${COR}"></b>charge</i>${m.inflows.length?`<i><b style="background:${LIM}"></b>entrée attendue</i>`:''}<i>−${eur0(m.quotidien)}/jour de train de vie</i></div>
    ${neg?`<div style="color:var(--coral);font-size:12.5px;font-weight:600;padding:2px 6px 4px">Solde négatif prévu le ${neg.d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div>`:''}`;
}

function vFlux(){
  const now=new Date(), AN=now.getFullYear(), MO=now.getMonth();
  const mois=D.tx.filter(t=>{const d=new Date(t.date_operation+'T00:00:00');
    return d.getFullYear()===AN&&d.getMonth()===MO&&!t.interne});
  const inn=mois.reduce((s,t)=>s+Math.max(0,Number(t.montant)),0);
  const out=mois.reduce((s,t)=>s+Math.max(0,-Number(t.montant)),0);
  const mxt=Math.max(inn,out)||1;
  const SEG=[['tout','Tout'],['dep','Dépenses'],['rev','Revenus'],['acl','À classer']];

  let h=hd(now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),'Mouvements',
    `<span class="pill">${D.tx.length}</span>`);

  h+=`<div class="grid" style="margin-top:0">
    <div class="card"><div class="k">Entrées du mois</div><div class="v pos">${eur0(inn)}</div>
      <div class="bar"><i style="width:${Math.round(inn/mxt*100)}%;background:var(--lime)"></i></div></div>
    <div class="card"><div class="k">Sorties du mois</div><div class="v neg">${eur0(out)}</div>
      <div class="bar"><i style="width:${Math.round(out/mxt*100)}%;background:var(--coral)"></i></div></div>
  </div>

  <div style="position:relative;margin-top:14px">
    <div style="position:absolute;left:14px;top:14px;color:var(--faint);pointer-events:none">${ic('search',20)}</div>
    <input id="fq" type="search" placeholder="Rechercher un libellé…" value="${esc(FLUX.q)}"
      style="padding-left:44px;margin-bottom:10px" oninput="FLUX.q=this.value;renderFlux()">
  </div>
  <div class="seg" id="fseg">${SEG.map(([k,l])=>
    `<button data-f="${k}" class="${FLUX.f===k?'on':''}" onclick="FLUX.f='${k}';renderFlux()">${l}</button>`).join('')}</div>
  <div id="fluxlist"></div>`;
  return h;
}

// Rendu de la liste filtrée (cote client, aucune requete)
function renderFlux(){
  const box=document.getElementById('fluxlist'); if(!box) return;
  document.querySelectorAll('#fseg button').forEach(b=>b.classList.toggle('on',b.dataset.f===FLUX.f));
  const q=(FLUX.q||'').trim().toLowerCase();
  const l=D.tx.filter(t=>{
    const v=Number(t.montant);
    if(FLUX.f==='dep'&&v>=0) return false;
    if(FLUX.f==='rev'&&v<=0) return false;
    if(FLUX.f==='acl'&&!(t.statut==='a_valider'||!D.catById[t.category_id])) return false;
    if(q&&!String(t.libelle||'').toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,150);

  if(!l.length){ box.innerHTML=`<div class="empty">${D.tx.length?'Aucun mouvement ne correspond.':"Rien pour l'instant.<br>Appuie sur + pour saisir une dépense."}</div>`; return }

  const grp=[];
  l.forEach(t=>{
    const j=new Date(t.date_operation+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if(!grp.length||grp[grp.length-1].j!==j) grp.push({j,ops:[]});
    grp[grp.length-1].ops.push(t);
  });

  box.innerHTML=grp.map(g=>{
    const tot=g.ops.reduce((s,t)=>s+Number(t.montant),0);
    return `<div class="dayhead"><div class="over">${g.j}</div>
      <div class="over" style="color:var(--faint)">${g.ops.length} op${g.ops.length>1?'s':''} · ${eur0(tot)}</div></div>
    <div class="list">`+g.ops.map(t=>{
      const c=D.catById[t.category_id], acl=t.statut==='a_valider'||!c;
      const col=acl?'var(--amber)':(c?c.couleur:'var(--muted)');
      const bg=acl?'var(--amber-bg)':(c&&c.couleur?c.couleur+'22':'var(--panel2)');
      return `<div class="row"><div class="ic" style="background:${bg};color:${col}">${acl?ic('quest',18):esc((c.nom||'?').trim().charAt(0).toUpperCase())}</div>
        <div class="mid"><div class="t">${esc(t.libelle)}</div>
        <div class="s"${acl?' style="color:var(--amber)"':''}>${acl?'à classer':esc(c.nom)}</div></div>
        <div class="amt ${Number(t.montant)<0?'neg':'pos'}">${eur(Number(t.montant))}</div></div>`;
    }).join('')+`</div>`;
  }).join('');
}

function vFixe(){
  const tot=D.rec.reduce((s,r)=>s+parMois(r),0);
  const moisKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  let h=hd('Récurrent','Charges & revenus');

  // --- recap : total + barre empilee par categorie ---
  const parCatRec={};
  D.rec.forEach(r=>{ const c=D.catById[r.category_id];
    const n=c?c.nom:'Autre', col=(c&&c.couleur)||'#9BA3AD';
    if(!parCatRec[n]) parCatRec[n]={v:0,col};
    parCatRec[n].v+=parMois(r); });
  const segs=Object.entries(parCatRec).sort((a,b)=>b[1].v-a[1].v);
  h+=`<div class="card" style="border-radius:var(--r-xl);padding:20px 18px">
    <div class="k">Charges fixes lissées</div>
    <div style="font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;letter-spacing:-.04em;margin-top:6px">${eur0(tot)}</div>
    <div class="n">par mois, toutes fréquences ramenées au mois</div>`;
  if(segs.length){
    h+=`<div class="stack">${segs.map(([n,o])=>`<i style="width:${(o.v/(tot||1)*100).toFixed(1)}%;background:${o.col}" title="${esc(n)}"></i>`).join('')}</div>
      <div class="legend">${segs.map(([n,o])=>`<div><b style="background:${o.col}"></b><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span style="margin-left:auto;color:var(--txt);font-family:'Geist Mono',monospace;font-size:12px">${eur0(o.v)}</span></div>`).join('')}</div>`;
  }
  h+=`</div>
  <button class="btn dash" style="margin-top:10px" onclick="openRec()">${ic('plus',18)} Ajouter une charge</button>`;

  h+=`<h2>Charges <span class="count">${D.rec.length}</span></h2>`;
  h+=D.rec.length?`<div class="list">`+D.rec.map(r=>{
    const lisse=r.frequence!=='mensuel'?` · ${eur0(parMois(r))}/mois lissé`:'';
    const quand=r.frequence==='mensuel'?`le ${r.jour_prelevement||'?'} du mois`
      :(r.prochaine_echeance?`prochaine : ${new Date(r.prochaine_echeance+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'})}`:PERIODE[r.frequence]);
    const c=D.catById[r.category_id], col=(c&&c.couleur)||'#9BA3AD';
    return `<div class="row"><div class="ic" style="background:${col}22;color:${col}">${r.est_abonnement?ic('repeat',18):esc((c?c.nom:'·').trim().charAt(0).toUpperCase())}</div>
      <div class="mid"><div class="t">${esc(r.nom)}</div><div class="s">${quand}${lisse}</div></div>
      <div class="amt neg">${eur(-r.montant)}</div>
      <button class="mini" onclick="delRec('${r.id}','${jsq(r.nom)}')" aria-label="Supprimer ${esc(r.nom)}">${ic('x',15)}</button></div>`;
  }).join('')+`</div>` : `<div class="empty">Ajoute loyer, crédits, assurances, abonnements.</div>`;

  // --- revenus ---
  const parM={};
  D.inc.forEach(i=>{ (parM[i.mois]=parM[i.mois]||[]).push(i) });
  const net=k=>(parM[k]||[]).filter(i=>!i.hors_budget).reduce((s,i)=>s+Number(i.montant_net),0);
  h+=`<h2>Revenus</h2>
  <div class="two" style="margin-bottom:12px">
    <button class="btn dash" onclick="openInc()">${ic('plus',18)} Revenu</button>
    <button class="btn dash" onclick="openFraisPro()">${ic('plus',18)} Frais pro</button></div>`;

  const now=new Date();
  const six=[...Array(6)].map((_,k)=>new Date(now.getFullYear(),now.getMonth()-5+k,1));
  const vals=six.map(d=>net(moisKey(d)));
  const mxv=Math.max(...vals,1);
  if(vals.some(v=>v>0)){
    h+=`<div class="card" style="margin-bottom:10px"><div class="k">6 derniers mois</div>
      <div class="histo">${six.map((d,k)=>`<div>
        <i class="${k===5?'on':''}" style="height:${Math.max(3,Math.round(vals[k]/mxv*100))}%" title="${eur0(vals[k])}"></i>
        <u>${d.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</u></div>`).join('')}</div>
      <div class="n">plus haut : ${eur0(mxv)}</div></div>`;
  }

  const mois=Object.keys(parM).sort().reverse();
  h+=mois.length?`<div class="list">`+mois.map(k=>{
    const t=net(k);
    const pp=parM[k].filter(i=>i.hors_budget).reduce((s,i)=>s+Number(i.montant_net),0);
    return `<div class="row"><div class="ic" style="background:var(--lime-bg);color:var(--lime)">${ic('wallet',18)}</div>
      <div class="mid"><div class="t">${new Date(k+'T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div>
      <div class="s">${parM[k].map(i=>esc(i.source)).join(' + ')}${pp?` · dont ${eur0(pp)} hors budget`:''}</div></div>
      <div class="amt pos">${eur(t)}</div></div>`;
  }).join('')+`</div>` : `<div class="empty">Ton salaire varie : saisis-le chaque mois.</div>`;

  // --- frais pro ---
  h+=`<h2>Frais pro Generali</h2>`;
  h+=(D.pro||[]).length?`<div class="list">`+D.pro.map(p=>{
    const nm=new Date(p.mois+'T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    let st,col,bg;
    if(p.statut==='sans_frais'){ st=ic('dash',18); col='var(--faint)'; bg='var(--panel2)' }
    else if(p.statut==='recu'){ st=ic('check',18); col='var(--lime)'; bg='var(--lime-bg)' }
    else { st=ic('clock',18); col='var(--amber)'; bg='var(--amber-bg)' }
    let sub;
    if(p.statut==='sans_frais') sub='aucun frais ce mois-là';
    else if(p.statut==='recu') sub=`reçu ${eur0(Number(p.montant_recu||p.montant))}`+(p.date_virement_n26?` · ${eur0(Number(p.montant_vire_n26))} virés sur N26`:' · virement N26 à saisir');
    else sub=`déclaré · virement attendu le ${p.date_virement_prevue?new Date(p.date_virement_prevue+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'?'}`;
    return `<div class="row"><div class="ic" style="background:${bg};color:${col}">${st}</div>
      <div class="mid"><div class="t">${nm}</div><div class="s">${sub}</div></div>
      <div class="amt ${p.montant?'pos':''}">${p.montant?eur(Number(p.montant)):''}</div>
      ${p.statut==='recu'&&!p.date_virement_n26?`<button class="mini ok" style="width:auto;padding:0 10px;font:600 12px Geist,sans-serif" onclick="openVirN26('${p.id}')">N26</button>`:''}
      ${p.statut==='declare'?`<button class="mini" onclick="openFraisPro('${p.mois}')" aria-label="Modifier">${ic('edit',15)}</button>`:''}</div>`;
  }).join('')+`</div>` : `<div class="empty">Rien encore — le rappel arrive le ${Number(D.set.jour_rappel_frais_pro||15)} du mois.</div>`;
  return h;
}

function vSet(){

  const paieFaite=D.inc.some(i=>i.mois===moisCourant);
  let h=hd('Configuration','Réglages');
  const an=new Date().getFullYear(), moisImpots=Number(D.set.mois_rappel_impots||7);
  const impotsFait=D.rec.some(r=>r.nom.includes(`revenus ${an-1}`)) ||
                   (D.set.impots_traites_an && Number(D.set.impots_traites_an)===an);
  if(new Date().getMonth()+1>=moisImpots && new Date().getMonth()+1<9 && !impotsFait)
    h+=`<div class="banner"><div class="bic" style="background:var(--panel2);color:var(--muted)">${ic('receipt',20)}</div>
      <div style="min-width:0"><div class="bt">Régularisation d'impôt sur le revenu</div>
      <div class="bs">Tu as reçu ton avis ? Saisis le montant pour qu'il entre dans la projection.</div>
      <div class="ba"><button onclick="openImpots()">Saisir le montant</button></div></div></div>`;

  if(jour>=Number(D.set.jour_rappel_frais_pro||15) && !proDuMois())
    h+=`<div class="banner pro"><div class="bic">${ic('case',20)}</div>
      <div style="min-width:0"><div class="bt">Frais pro Generali du mois</div>
      <div class="bs">On est le ${jour} — as-tu déclaré tes frais ?</div>
      <div class="ba"><button onclick="openFraisPro()">Oui, saisir le montant</button>

async function classe(txId,catId,libelle){
  const {error}=await SB.from('transactions').update({category_id:catId,statut:'confirmee'}).eq('id',txId);
  if(error) return toast(error.message);
  const motif=(libelle||'').toUpperCase().split(/[\s*]+/).filter(w=>w.length>3)[0];
  if(motif) await SB.from('categorization_rules').upsert({user_id:U.id,category_id:catId,motif},{onConflict:'user_id,motif'});
  toast('Classé'); load();
}

function sheet(html,bloquant){
  const o=document.createElement('div');o.className='ovl';
  const h=html.replace(/^\s*<h3>([\s\S]*?)<\/h3>/,(m,t)=>`<div class="shead"><h3>${t}</h3>${bloquant?'':`<button class="closex" aria-label="Fermer">${ic('x',18)}</button>`}</div>`);
  o.innerHTML=`<div class="sheet"><div class="handle"></div>${h}</div>`;
  const cx=o.querySelector('.closex'); if(cx) cx.onclick=()=>o.remove();
  if(!bloquant) o.onclick=e=>{if(e.target===o)o.remove()};
  document.body.appendChild(o);return o;
}

function opsDuMois(cat){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth();
  return D.tx.filter(t=>{
    if(Number(t.montant)>=0 || t.statut==='ignoree' || t.interne) return false;
    const d=new Date(t.date_operation+'T00:00:00');
    if(d.getFullYear()!==Y || d.getMonth()!==M) return false;
    if(cat && (D.catById[t.category_id]?.nom||'Non classé')!==cat) return false;
    return true;
  }).sort((a,b)=>b.date_operation.localeCompare(a.date_operation));
}

function openDepMois(cat){
  const ops=opsDuMois(cat);
  const tot=ops.reduce((s,t)=>s+Math.abs(Number(t.montant)),0);
  const mois=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  let h=`<h3>${cat?esc(cat):'Dépenses du mois'} <span class="count">${eur0(tot)}</span></h3>
    <div class="over" style="margin:-8px 0 14px;color:var(--faint)">${ops.length} opération${ops.length>1?'s':''} · ${mois}</div>`;
  if(!ops.length){ sheet(h+`<div class="empty">Aucune dépense ce mois-ci.</div>`); return }
  let jour='';
  ops.forEach((t,k)=>{
    const j=new Date(t.date_operation+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if(j!==jour){ h+=`${jour?'</div>':''}<div class="dayhead"><div class="over">${j}</div></div><div class="list">`; jour=j }
    const c=D.catById[t.category_id], a=D.acc.find(x=>x.id===t.account_id);
    const acl=t.statut==='a_valider'||!c;
    h+=`<div class="row"><div class="ic" style="background:${acl?'var(--amber-bg)':(c.couleur?c.couleur+'22':'var(--panel2)')};color:${acl?'var(--amber)':(c.couleur||'var(--muted)')}">${acl?ic('quest',18):esc((c.nom||'?').trim().charAt(0).toUpperCase())}</div>
      <div class="mid"><div class="t">${esc(t.libelle)}</div>
      <div class="s">${cat?(a?esc(a.nom):'—'):(acl?'à classer':esc(c.nom))}</div></div>
      <div class="amt neg">${eur(Number(t.montant))}</div></div>`;
  });
  sheet(h+'</div>');
}

function openASortir(){
  const m=moteur(), l=m.aVenirMois;
  const fm=new Date(new Date().getFullYear(),new Date().getMonth()+1,0);
  const nm=fm.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  let h=`<h3>À sortir d'ici la fin du mois <span class="count">${eur0(m.totalAVenirMois)}</span></h3>
    <div class="over" style="margin:-8px 0 14px;color:var(--faint)">${l.length} échéance${l.length>1?'s':''} · jusqu'au ${fm.getDate()} ${nm}</div>`;
  if(!l.length){ sheet(h+`<div class="empty">Plus rien à sortir d'ici la fin du mois.</div>`); return }
  let jour='';
  l.forEach(p=>{
    const j=p.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if(j!==jour){ h+=`${jour?'</div>':''}<div class="dayhead"><div class="over">${j}</div></div><div class="list">`; jour=j }
    h+=`<div class="row"><div class="datepill"><i>${p.date.getDate()}</i><u>${p.date.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</u></div>

  h+=`</div><div class="note">Solde courant actuel ${eur0(m.solde)} → ${eur0(m.solde-m.totalAVenirMois)} une fois tout passé.</div>`;

}

  const o=sheet(`<h3>Nouvelle opération</h3>

      <button type="button" class="on neg" data-k="dep">Dépense</button>
      <button type="button" data-k="rev">Rentrée</button></div>

    <div class="two">
      <div class="field"><label>Date</label><input type="date" id="a_dt" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Compte</label><select id="a_acc">${D.acc.map(a=>`<option value="${a.id}">${esc(a.nom)}</option>`).join('')||'<option value="">—</option>'}</select></div></div>

    <div class="chips" id="a_ch" style="margin-bottom:4px">${D.cats.map(c=>
      `<button type="button" class="chip" data-id="${c.id}" data-rev="${c.type==='revenu'?1:0}"><b style="background:${c.couleur||'#9BA3AD'}"></b>${esc(c.nom)}</button>`).join('')}</div>
    <button class="btn primary" id="a_go" style="margin-top:16px">${ic('check',18)} Enregistrer</button>`);

  const sel=o.querySelector('#a_cat'), mt=o.querySelector('#a_mt');
  // chips <-> select conserve
  const syncChips=()=>{
    o.querySelectorAll('#a_ch .chip').forEach(b=>{
      const ok=(b.dataset.rev==='1')!==dep;
      b.classList.toggle('hidden',!ok);
      b.classList.toggle('on',b.dataset.id===sel.value);
    });
    const vis=[...o.querySelectorAll('#a_ch .chip:not(.hidden)')];
    if(vis.length && !vis.some(b=>b.dataset.id===sel.value)){ sel.value=vis[0].dataset.id; }
    o.querySelectorAll('#a_ch .chip').forEach(b=>b.classList.toggle('on',b.dataset.id===sel.value));
  };

  o.querySelectorAll('#a_sg button').forEach(b=>b.onclick=()=>{
    dep=b.dataset.k==='dep';
    o.querySelectorAll('#a_sg button').forEach(x=>{
      x.classList.toggle('on',x===b);
      x.classList.toggle('neg',x.dataset.k==='dep');
      x.classList.toggle('pos',x.dataset.k==='rev');
    });
    mt.style.color=dep?'var(--coral)':'var(--lime)';
    syncChips();
  });
  syncChips();

  o.querySelector('#a_go').onclick=async()=>{
    const brut=parseFloat(mt.value);
    if(isNaN(brut)) return toast('Montant manquant');
    const montant=dep?-Math.abs(brut):Math.abs(brut);   // le signe vient du segmented
    const acc=o.querySelector('#a_acc').value||null;
    const {error}=await SB.from('transactions').insert({user_id:U.id,libelle:o.querySelector('#a_lib').value||'Opération',
      montant,date_operation:o.querySelector('#a_dt').value,category_id:sel.value,

    if(error) return toast(error.message);
    if(acc){const a=D.acc.find(x=>x.id===acc); if(a) await SB.from('accounts').update({solde:Number(a.solde)+montant}).eq('id',acc)}
    o.remove(); toast('Ajouté'); load();
  };
}

// Rapprochement du virement Generali recu avec le montant declare.
// Ecart <= tolerance : automatique. Au-dela : on demande confirmation.
async function rapprocherFraisPro(){
  PRO_CONFIRM=[];
  if(!U||!(D.pro||[]).length) return false;
  const tol=Number(D.set.frais_pro_tolerance??5);
  const persos=new Set(D.acc.filter(a=>!a.exclu_budget).map(a=>a.id));
  const lies=new Set(D.pro.map(p=>p.transaction_id).filter(Boolean));
  let maj=false;
  for(const p of D.pro){
    if(p.statut!=='declare'||!p.montant||p.transaction_id) continue;
    const ref=new Date((p.date_virement_prevue||p.date_declaration)+'T00:00:00');
    const ecartees=new Set(p.tx_ecartees||[]);
    const c=D.tx.filter(t=>Number(t.montant)>0 && !lies.has(t.id) && !ecartees.has(t.id)
        && (!t.account_id||persos.has(t.account_id))
        && Math.abs(new Date(t.date_operation+'T00:00:00')-ref)<=10*864e5
        && Number(t.montant)<=Number(p.montant)*2.5)
      .map(t=>({t,diff:Math.abs(Number(t.montant)-Number(p.montant)),
                gen:/generali/i.test((t.libelle||'')+' '+(t.contrepartie||''))?1:0}))
      .sort((a,b)=>(b.gen-a.gen)||(a.diff-b.diff));
    if(!c.length) continue;
    const best=c[0];
    if(best.diff<=tol){
      const {error}=await SB.from('frais_pro').update({statut:'recu',transaction_id:best.t.id,
        montant_recu:Number(best.t.montant),rapproche_le:new Date().toISOString()}).eq('id',p.id);
      if(!error){ maj=true; lies.add(best.t.id) }
    }else{
      PRO_CONFIRM.push({pro:p,tx:best.t});
    }
  }
  return maj;
}

let syncEnCours=false;
async function syncPonto(forcer){
  if(syncEnCours) return;
  syncEnCours=true;
  if(forcer) toast('Synchronisation en cours…');
  try{
    const {data:{session}} = await SB.auth.getSession();
    if(!session) return;
    const r = await fetch('https://rjnysyddgpcjzmfbpyba.supabase.co/functions/v1/ponto-sync',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({forcer:!!forcer})
    });
    const j = await r.json().catch(()=>({error:'Réponse illisible'}));
    if(j.error){ if(forcer) toast(j.error.slice(0,110)); return }
    if(forcer) toast(j.transactions?`${j.comptes} compte(s), ${j.transactions} nouvelle(s) opération(s)${j.a_valider?` · ${j.a_valider} à confirmer`:''}`:`${j.comptes} compte(s) à jour · aucune nouvelle opération`);
    await load();
  }catch(e){ if(forcer) toast('Synchro impossible : '+String(e.message||e).slice(0,80)) }
  finally{ syncEnCours=false }
}

async function togglePartage(id,partage){
  const {error}=await SB.from('accounts').update({foyer_id:partage?null:D.foyer.id}).eq('id',id);
  if(error) return toast(error.message);
  toast(partage?'Compte repassé en privé':'Compte partagé avec le foyer'); load();
}
function openInvit(){
  const o=sheet(`<h3><span class="hbadge" style="background:#241C33;color:var(--violet)">${ic('users',18)}</span>Inviter au foyer</h3>
    <div class="infobox">${ic('info',18)}<div>La personne rejoindra le foyer à sa première connexion avec cette adresse. Elle verra uniquement les comptes rattachés au foyer.</div></div>
    <div class="field"><label>Adresse e-mail</label><input type="email" id="v_e" placeholder="prenom@gmail.com"></div>
    <button class="btn primary" id="v_go">${ic('mail',18)} Envoyer l'invitation</button>`);
  o.querySelector('#v_go').onclick=async()=>{
    const e=o.querySelector('#v_e').value.trim(); if(!e) return toast('E-mail manquant');
    const {error}=await SB.from('foyer_invitations').insert({foyer_id:D.foyer.id,email:e});
    if(error) return toast(error.message);
    o.remove(); toast('Invitation créée'); load();
  };
}
async function creerFoyer(){
  const nom=prompt('Nom du foyer :','Mon foyer'); if(!nom) return;
  const {data,error}=await SB.from('foyers').insert({nom,created_by:U.id}).select().single();
  if(error) return toast(error.message);
  await SB.from('foyer_membres').insert({foyer_id:data.id,user_id:U.id,role:'proprietaire'});
  toast('Foyer créé'); load();
}
async function majSolde(id,cur){
  const v=prompt('Solde actuel du compte :',cur); if(v===null) return;
  const n=parseFloat(String(v).replace(',','.')); if(isNaN(n)) return toast('Montant invalide');
  await SB.from('accounts').update({solde:n}).eq('id',id); toast('Solde mis à jour'); load();
}
async function saveSet(){
  const {error}=await SB.from('settings').upsert({user_id:U.id,
    objectif_epargne_mensuel:parseFloat(document.getElementById('s_ep').value)||0,
    seuil_orange:parseFloat(document.getElementById('s_or').value)||0,
    seuil_rouge:parseFloat(document.getElementById('s_ro').value)||0,
    jour_rappel_paie:parseInt(document.getElementById('s_jr').value)||25,
    jour_rappel_frais_pro:parseInt(document.getElementById('s_fp').value)||15,
    frais_pro_delai_jours:parseInt(document.getElementById('s_fd').value)||0,
    frais_pro_tolerance:parseFloat(document.getElementById('s_ft').value)||0},{onConflict:'user_id'});
  toast(error?error.message:'Enregistré'); load();
}

/* ---------- BOOT ---------- */
SB.auth.onAuthStateChange(async(_e,s)=>{
  U=s?.user||null;
  if(U){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    await load();
    // Resynchronisation à l'ouverture, seulement si l'utilisateur a configuré son Ponto
    if(D.pontoCred) syncPonto(true);
  }else{
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  }
});
SB.auth.getSession();
</script>
