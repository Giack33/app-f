<style>
:root{
  --bg:#0b0f14; --panel:#141b24; --panel2:#1b2430; --line:#263241;
  --txt:#e8eef5; --muted:#8da0b5; --dim:#5f7183;
  --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --blue:#38bdf8;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:hidden}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.hidden{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:400px;text-align:center}
.loginbox h1{font-size:30px;letter-spacing:-.5px;margin-bottom:8px}
.loginbox p{color:var(--muted);margin-bottom:28px;font-size:15px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 15px Inter,sans-serif;cursor:pointer;transition:.15s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--txt);color:#0b0f14;border-color:var(--txt)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--red);border-color:#ef444455}
.sep{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:18px 0}
.sep:before,.sep:after{content:'';flex:1;height:1px;background:var(--line)}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:500 15px Inter,sans-serif;margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--blue)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* HEADER */
header{max-width:860px;margin:0 auto;padding:18px 16px 0}
header .ttl{font-size:13px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}

/* HERO */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--heroc,var(--green))}
.hero .lbl{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero .big{font-size:clamp(34px,11vw,56px);font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin:10px 0 4px;color:var(--heroc,var(--green));word-break:break-word}
.hero .sub{color:var(--muted);font-size:13.5px;line-height:1.45}
.verdict{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--panel2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--heroc,var(--green));flex-shrink:0}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;min-width:0}
.card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;line-height:1.3}
.card .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:26px 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 .count{background:var(--panel2);color:var(--txt);border-radius:999px;padding:3px 10px;font-size:11.5px;letter-spacing:0;text-transform:none;white-space:nowrap;flex-shrink:0}

/* LIST */
.row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:7px;min-width:0}
.row .ic{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--panel2)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-size:15px;white-space:nowrap;flex-shrink:0}
.neg{color:var(--red)}.pos{color:var(--green)}
.empty{color:var(--dim);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px;line-height:1.5}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;padding:4px 2px 0}

/* CHART */
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 8px;overflow:hidden}
.chartbox svg{display:block;width:100%;height:auto}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;padding:10px 6px 2px}
.chiplist i{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:4px 10px}
.chiplist i b{width:7px;height:7px;border-radius:50%;display:inline-block}

/* VALIDATION */
.valid{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:9px}
.valid .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:600 12.5px Inter,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--blue)}

/* TABS */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,20,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
nav button{background:none;border:none;color:var(--dim);font:600 10px Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:10px}
nav button.on{color:var(--txt)}
nav button span{font-size:18px;line-height:1}

.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--txt);color:#0b0f14;border:none;font-size:26px;cursor:pointer;box-shadow:0 10px 30px #0009;z-index:41}

/* MODAL */
.ovl{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:grid;place-items:end center;z-index:50;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:540px;max-height:90vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:99;max-width:90vw;text-align:center}
</style>

<script>
const SB = supabase.createClient(
  'https://rjnysyddgpcjzmfbpyba.supabase.co',
  'sb_publishable_U4U7mmNvzILkPh7LkNwkkw_2xIkoCz9'
);
let U=null, D={}, TAB='home';
const TITRES={home:'Pilotage',flux:'Mouvements',fixe:'Charges & revenus',set:'Réglages'};
const eur = n => (n<0?'-':'')+Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0 = n => (n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('fr-FR')+' €';
const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const jsq = s => String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const PERIODE={hebdomadaire:'par semaine',mensuel:'par mois',bimestriel:'tous les 2 mois',trimestriel:'par trimestre',semestriel:'par semestre',annuel:'par an'};
const PAR_AN={hebdomadaire:52,mensuel:12,bimestriel:6,trimestriel:4,semestriel:2,annuel:1};
const parMois = r => Number(r.montant)*(PAR_AN[r.frequence]||12)/12;

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

async function google(){
  const {error} = await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error) toast("Google indisponible — utilise l'e-mail");
}
async function magic(){
  const email = document.getElementById('mail').value.trim();
  if(!email) return toast('Entre ton e-mail');
  const {error} = await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});
  toast(error ? error.message : 'Lien envoyé ! Regarde ta boîte mail.');
}
async function logout(){ await SB.auth.signOut(); location.reload() }

/* ---------- CHARGEMENT ---------- */
async function load(){
  const [s,c,a,t,r,i,d,fy,fm,fi,pr,pc,fp] = await Promise.all([
    SB.from('settings').select('*').maybeSingle(),
    SB.from('categories').select('*').order('type').order('nom'),
    SB.from('accounts').select('*').eq('actif',true),
    SB.from('transactions').select('*').order('date_operation',{ascending:false}).limit(2000),
    SB.from('recurring_charges').select('*').eq('actif',true),
    SB.from('incomes').select('*').order('mois',{ascending:false}).limit(24),
    SB.from('documents').select('*').eq('statut','a_traiter'),
    SB.from('foyers').select('*').maybeSingle(),
    SB.from('foyer_membres').select('*'),
    SB.from('foyer_invitations').select('*'),
    SB.from('profiles').select('id,email,full_name'),
    SB.rpc('ponto_configure'),
    SB.from('frais_pro').select('*').order('mois',{ascending:false}).limit(24)
  ]);
  D = {set:s.data||{}, cats:c.data||[], acc:a.data||[], tx:t.data||[], rec:r.data||[], inc:i.data||[], docs:d.data||[],
       foyer:fy.data||null, membres:fm.data||[], invits:fi.data||[], profils:pr.data||[],
       pontoCred:pc.data||null, pro:fp.data||[]};  // horodatage de configuration, jamais les identifiants
  // Toutes les catégories servent à résoudre les libellés (dont celles du conjoint) ;
  // au choix on ne propose que les actives, dédoublonnées par nom.
  D.catById = Object.fromEntries(D.cats.map(x=>[x.id,x]));
  marquerVirementsInternes();
  const vues = new Set();
  D.cats = D.cats
    .filter(x=>x.actif!==false)
    .sort((a,b)=>(b.foyer_id?1:0)-(a.foyer_id?1:0) || (a.user_id===U.id?-1:1))
    .filter(x=>!vues.has(x.nom) && vues.add(x.nom));
  const auj=new Date().toISOString().slice(0,10);
  D.rec = D.rec.filter(r=>!r.date_fin || r.date_fin>=auj);
  D.rec.sort((x,y)=>parMois(y)-parMois(x));
  if(await rapprocherFraisPro()){
    const {data}=await SB.from('frais_pro').select('*').order('mois',{ascending:false}).limit(24);
    D.pro=data||[];
  }
  render();
  notifsFraisPro();
}

/* ---------- ÉCHÉANCES ---------- */
// Toutes les dates où une charge tombe entre deux bornes, quelle que soit sa fréquence.
function echeances(r, debut, fin){
  const out=[], pas=12/(PAR_AN[r.frequence]||12);
  if(r.date_fin){ const f=new Date(r.date_fin+'T00:00:00'); if(f<fin) fin=f; if(fin<debut) return out; }
  if(r.frequence==='hebdomadaire'){
    let d=new Date(debut);
    while(d<=fin){ out.push(new Date(d)); d.setDate(d.getDate()+7) }
    return out;
  }
  if(r.frequence==='mensuel'){
    const j=r.jour_prelevement||1;
    let d=new Date(debut.getFullYear(),debut.getMonth(),1);
    while(d<=fin){
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const date=new Date(d.getFullYear(),d.getMonth(),Math.min(j,dim));
      if(date>=debut && date<=fin) out.push(date);
      d.setMonth(d.getMonth()+1);
    }
    return out;
  }
  // bimestriel / trimestriel / semestriel / annuel : on part de la prochaine échéance connue
  if(!r.prochaine_echeance) return out;
  let d=new Date(r.prochaine_echeance+'T00:00:00');
  while(d<debut){ d.setMonth(d.getMonth()+pas) }
  while(d<=fin){ out.push(new Date(d)); d.setMonth(d.getMonth()+pas) }
  return out;
}

/* ---------- VIREMENTS INTERNES ---------- */
// Un virement d'un compte du foyer vers un autre n'est ni une depense ni un revenu :
// c'est le meme argent qui change de poche. On apparie chaque debit avec un credit
// du meme montant sur un autre compte, a 4 jours pres, puis on neutralise les deux.
function marquerVirementsInternes(){
  D.tx.forEach(t=>{ t.interne=false });
  const credits={};
  D.tx.filter(t=>Number(t.montant)>0).forEach(t=>{
    const k=Number(t.montant).toFixed(2); (credits[k]=credits[k]||[]).push(t);
  });
  D.tx.filter(t=>Number(t.montant)<0).forEach(d=>{
    const lot=credits[Math.abs(Number(d.montant)).toFixed(2)]; if(!lot) return;
    const dd=new Date(d.date_operation+'T00:00:00');
    const c=lot.find(x=>!x.interne && x.account_id!==d.account_id
      && Math.abs(new Date(x.date_operation+'T00:00:00')-dd)<=4*864e5);
    if(c){ d.interne=true; c.interne=true }
  });
}

/* ---------- ENTREES ATTENDUES ---------- */
// Cle de regroupement d'un credit : on ne garde que le nom de l'emetteur,
// debarrasse des numeros de virement et du jargon bancaire.
function cleEntree(t){
  const s=(t.contrepartie||t.libelle||'').toUpperCase()
    .replace(/REF\s*:.*$/,' ').replace(/MOTIF.*$/,' ')
    .replace(/[0-9]+/g,' ')
    .replace(/\bVIR(EMENT)?\b|\bINST(ANTANE)?\b|\bEUROPEEN\b|\bPERM\b|\bRECU\b|\bEMIS\b|\bLOGITEL\b|\bWERO\b|\bDE\s*:|\bPOUR\s*:/g,' ')
    .replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  return s.split(' ').filter(w=>w.length>1).slice(0,3).join(' ');
}
function nomEntree(k){
  if(/GENERALI/.test(k)) return 'Salaire Generali';
  return k.split(' ').map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
}
// Un emetteur qui verse au moins 2 mois sur les 6 derniers, et encore recemment, est
// considere comme recurrent. On ne retient qu'un versement par mois (le plus gros : le
// salaire, pas le petit remboursement du meme emetteur), puis on moyenne les 3 derniers.
function entreesRecurrentes(){
  const now=new Date(), limite=new Date(now.getFullYear(),now.getMonth()-5,1);
  const grp={};
  D.tx.forEach(t=>{
    const v=Number(t.montant);
    if(v<=0 || t.interne || t.statut==='ignoree') return;
    if(v<150) return;                                  // on laisse de cote les petits remboursements
    const d=new Date(t.date_operation+'T00:00:00'); if(d<limite) return;
    const k=cleEntree(t); if(!k) return;
    const km=d.getFullYear()+'-'+d.getMonth();
    const g=grp[k]=grp[k]||{};
    if(!g[km] || v>g[km].montant) g[km]={montant:v,d};
  });
  const out=[];
  Object.entries(grp).forEach(([k,parMoisK])=>{
    const lot=Object.values(parMoisK).sort((a,b)=>b.d-a.d);
    if(lot.length<2) return;                           // pas assez regulier pour etre projete
    if((now-lot[0].d)>50*864e5) return;                // tari depuis plus d'un mois et demi : on n'extrapole pas
    const der=lot.slice(0,3);
    const jours=der.map(x=>x.d.getDate()).sort((a,b)=>a-b);
    out.push({nom:nomEntree(k),
              montant:Math.round(der.reduce((s,x)=>s+x.montant,0)/der.length*100)/100,
              jour:jours[Math.floor(jours.length/2)], dernier:lot[0].d});
  });
  return out.sort((a,b)=>b.montant-a.montant);
}
// Projette ces entrees sur la periode demandee, sans redoubler une entree
// deja encaissee dans le mois concerne.
function entreesPrevues(debut,fin){
  const out=[], rec=entreesRecurrentes();
  const poser=(nom,montant,jour,dejaVu)=>{
    let d=new Date(debut.getFullYear(),debut.getMonth(),1);
    while(d<=fin){
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const date=new Date(d.getFullYear(),d.getMonth(),Math.min(jour,dim));
      if(date>=debut && date<=fin && !dejaVu(date)) out.push({nom,montant,date,estime:true});
      d.setMonth(d.getMonth()+1);
    }
  };
  rec.forEach(r=>poser(r.nom,r.montant,r.jour,
    date=>r.dernier.getFullYear()===date.getFullYear() && r.dernier.getMonth()===date.getMonth()));

  // Filet de securite : le salaire Generali, si l'historique des credits ne l'a pas encore vu
  // (il arrive le 25 a un jour pres, pour un montant variable selon les commissions).
  if(!rec.some(r=>/generali/i.test(r.nom))){
    const sal=D.inc.filter(i=>/salaire/i.test(i.source||'')).slice(0,3);
    if(sal.length){
      const montant=Math.round(sal.reduce((s,i)=>s+Number(i.montant_net),0)/sal.length*100)/100;
      poser('Salaire Generali (estime)',montant,Number(D.set.jour_rappel_paie||25),
        date=>D.inc.some(i=>/salaire/i.test(i.source||'') && String(i.mois).slice(0,7)===
          date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')));
    }
  }
  return out.sort((a,b)=>a.date-b.date);
}

/* ---------- MOTEUR DE CALCUL ---------- */
function moteur(){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth(), today=now.getDate();
  const aujourdhui=new Date(Y,M,today);
  const finMois=new Date(Y,M+1,0);
  const joursRestants=finMois.getDate()-today+1;
  const HORIZON=joursRestants;                       // on projette jusqu'a la fin du mois en cours
  const fin=new Date(Y,M,today+HORIZON-1);

  const solde=D.acc.filter(a=>a.type==='courant'&&!a.exclu_budget).reduce((s,a)=>s+Number(a.solde),0);

  // ce qui tombe encore d'ici la fin du mois, toutes fréquences confondues
  const aVenir=[];
  D.rec.forEach(r=>echeances(r,aujourdhui,fin).forEach(d=>aVenir.push({nom:r.nom,montant:Number(r.montant),date:d,abo:r.est_abonnement,freq:r.frequence})));
  D.docs.forEach(x=>{
    if(!x.montant) return;
    const d=x.date_echeance?new Date(x.date_echeance+'T00:00:00'):null;
    if(d && d>=aujourdhui && d<=fin) aVenir.push({nom:x.fournisseur||'Facture',montant:Number(x.montant),date:d,facture:true});
  });
  aVenir.sort((a,b)=>a.date-b.date);
  const totalAVenir=aVenir.reduce((s,x)=>s+x.montant,0);
  const aVenirMois=aVenir.filter(x=>x.date<=finMois);
  const totalAVenirMois=aVenirMois.reduce((s,x)=>s+x.montant,0);

  // frais pro declares : virement Generali attendu, pas encore rapproche
  const proPrevus=(D.pro||[]).filter(p=>p.statut==='declare'&&p.montant&&p.date_virement_prevue)
    .map(p=>({mois:p.mois,montant:Number(p.montant),date:new Date(p.date_virement_prevue+'T00:00:00')}))
    .sort((a,b)=>a.date-b.date);
  const totalProPrevu=proPrevus.reduce((s,x)=>s+x.montant,0);
  const proRecu=(D.pro||[]).find(p=>p.statut==='recu'&&!p.date_virement_n26);

  // épargne du mois pas encore mise de côté
  const objEp=Number(D.set.objectif_epargne_mensuel||0);
  const dejaEp=D.tx.filter(t=>{
    const c=D.catById[t.category_id], dt=new Date(t.date_operation+'T00:00:00');
    return c && c.type==='epargne' && dt.getFullYear()===Y && dt.getMonth()===M;
  }).reduce((s,t)=>s+Math.abs(Number(t.montant)),0);
  const epRestante=Math.max(0,objEp-dejaEp);

  // Entrees attendues : salaire, apport du conjoint, remboursement de frais pro.
  // Sans elles la courbe plongeait mecaniquement : elle ne voyait que les sorties.
  const inflows=[...entreesPrevues(aujourdhui,fin),
                 ...proPrevus.map(p=>({nom:'Frais pro Generali',montant:p.montant,date:p.date,pro:true}))]
                .filter(e=>e.date>aujourdhui && e.date<=fin)
                .sort((a,b)=>a.date-b.date);
  const totalEntrees=inflows.reduce((s,e)=>s+e.montant,0);
  const prochaine=inflows[0]||null;

  // Le reste a vivre se compte jusqu'a la prochaine entree d'argent, pas jusqu'au 31.
  const borne=prochaine?prochaine.date:finMois;
  const joursAvantEntree=Math.max(1,Math.round((borne-aujourdhui)/864e5));
  const sortiesAvantEntree=aVenir.filter(x=>x.date<=borne).reduce((s,x)=>s+x.montant,0);
  const reste=solde-sortiesAvantEntree-epRestante;
  const hebdo=reste/(joursAvantEntree/7);
  const parJour=reste/joursAvantEntree;

  const so=Number(D.set.seuil_orange??200), sr=Number(D.set.seuil_rouge??50);
  let couleur='var(--green)', verdict='Tu peux dépenser';
  if(reste<sr){couleur='var(--red)'; verdict="C'est chaud — on serre"}
  else if(reste<so){couleur='var(--orange)'; verdict='Prudence cette semaine'}

  // dépenses par catégorie, ce mois-ci et le mois dernier
  const pm=new Date(Y,M-1,1);
  const parCat={}, parCatPrec={};
  let depMois=0;
  D.tx.forEach(t=>{
    if(Number(t.montant)>=0 || t.statut==='ignoree' || t.interne) return;
    const dt=new Date(t.date_operation+'T00:00:00');
    const nom=D.catById[t.category_id]?.nom||'Non classé', v=Math.abs(Number(t.montant));
    if(dt.getFullYear()===Y && dt.getMonth()===M){ parCat[nom]=(parCat[nom]||0)+v; depMois+=v }
    else if(dt.getFullYear()===pm.getFullYear() && dt.getMonth()===pm.getMonth()){ parCatPrec[nom]=(parCatPrec[nom]||0)+v }
  });

  // revenu mensuel moyen, calculé par mois puis moyenné
  const parMoisRev={};
  D.inc.filter(i=>!i.hors_budget).forEach(i=>{ parMoisRev[i.mois]=(parMoisRev[i.mois]||0)+Number(i.montant_net) });
  const moisTries=Object.keys(parMoisRev).sort().reverse().slice(0,3);
  const revMoy=moisTries.length?moisTries.reduce((s,k)=>s+parMoisRev[k],0)/moisTries.length:0;

  // projection jour par jour jusqu'à la fin du mois seulement.
  // Aucun salaire futur n'est injecté : il est variable, donc inconnu tant qu'il n'est pas saisi.
  const sorties={}, detail={};
  aVenir.forEach(x=>{
    if(x.date<=aujourdhui) return;
    const k=x.date.toDateString();
    sorties[k]=(sorties[k]||0)+x.montant;
    (detail[k]=detail[k]||[]).push(x.nom);
  });
  const entrees={}, detailIn={};
  inflows.forEach(p=>{ const k=p.date.toDateString(); entrees[k]=(entrees[k]||0)+p.montant; (detailIn[k]=detailIn[k]||[]).push(p.nom) });
  const quotidien=parJourMoyen();
  const proj=[]; let bal=solde;
  for(let k=0;k<HORIZON;k++){
    const d=new Date(Y,M,today+k);
    const key=d.toDateString();
    if(k>0){
      bal-=sorties[key]||0;
      bal+=entrees[key]||0;
      bal-=quotidien;
    }
    proj.push({d,bal,out:sorties[key]||0,inn:entrees[key]||0,noms:detail[key]||[],nomsIn:detailIn[key]||[]});
  }
  const finMoisBal=proj.length?proj[Math.min(joursRestants-1,proj.length-1)].bal:solde;
  const finHorizonBal=proj.length?proj[proj.length-1].bal:solde;
  const negPrevu=proj.find(x=>x.bal<0)||null;

  return {solde,totalAVenir,epRestante,reste,hebdo,parJour,couleur,verdict,joursRestants,finMois,finMoisBal,
          HORIZON,fin,finHorizonBal,inflows,totalEntrees,prochaine,joursAvantEntree,aVenirMois,totalAVenirMois,negPrevu,
          parCat,parCatPrec,depMois,proj,aVenir,revMoy,quotidien,proPrevus,totalProPrevu,proRecu,
          aValider:D.tx.filter(t=>t.statut==='a_valider'),
          abos:D.rec.filter(r=>r.est_abonnement),
          chargesMois:D.rec.reduce((s,r)=>s+parMois(r),0)};
}
function parJourMoyen(){
  const d30=D.tx.filter(t=>Number(t.montant)<0 && t.statut!=='ignoree' && !t.interne
    && (Date.now()-new Date(t.date_operation+'T00:00:00'))<30*864e5
    && !depenseNeutre(t));
  return d30.length?d30.reduce((s,t)=>s+Math.abs(Number(t.montant)),0)/30:0;
}
// Ni train de vie, ni dépense reelle : les charges fixes (deja projetees a leur date),
// l'epargne (mise de cote, pas depensee), les frais pro (rembourses) et les transferts internes.
function depenseNeutre(t){
  const c=D.catById[t.category_id];
  if(!c) return false;
  return c.type==='fixe' || c.type==='epargne' || /transfert|frais pro/i.test(c.nom||'');
}

    h+=`<div class="note">Soit ${eur0(tot*12)} sur l'année.</div>`;
  }
  return h;
}

function drawChart(){
  const m=moteur(), p=m.proj; if(p.length<2) return;
  const W=720,H=252,L=56,R=74,T=26,B=38;
  const vals=p.map(x=>x.bal);
  let mn=Math.min(0,...vals), mx=Math.max(...vals,0);
  if(mx===mn) mx=mn+100;
  const pad=(mx-mn)*0.14; mn-=pad; mx+=pad;
  const n=p.length;
  const step=(W-L-R)/(n-1);
  const X=i=>L+i*step;
  const Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const f1=v=>v.toFixed(1);
  const col=m.couleur;

  // bandes du week-end
  let we='';
  p.forEach((x,i)=>{
    const j=x.d.getDay();
    if(j===0||j===6){
      const x0=Math.max(L,X(i)-step/2), x1=Math.min(W-R,X(i)+step/2);
      we+=`<rect x="${f1(x0)}" y="${T}" width="${f1(Math.max(0,x1-x0))}" height="${H-T-B}" fill="#ffffff" opacity=".022"/>`;
    }
  });

  // grille + échelle
  let gy='';
  const niveaux=[mx,mx-(mx-mn)/3,mn+(mx-mn)/3,mn];
  niveaux.forEach(v=>{
    gy+=`<line x1="${L}" y1="${f1(Y(v))}" x2="${W-R}" y2="${f1(Y(v))}" stroke="#263241" stroke-width="1"/>
         <text x="${L-8}" y="${f1(Y(v)+3.5)}" fill="#5f7183" font-size="10.5" font-family="Inter,sans-serif" text-anchor="end">${eur0(v)}</text>`;
  });

  const line=p.map((x,i)=>`${i?'L':'M'}${f1(X(i))} ${f1(Y(x.bal))}`).join(' ');
  const base=Y(mn);
  const area=`${line} L${f1(X(n-1))} ${f1(base)} L${f1(X(0))} ${f1(base)} Z`;
  const z=Y(0);
  const neg=p.find(x=>x.bal<0);

  // repères : jours où une charge tombe
  let marks='';
  const gros=[...p].filter(x=>x.out>0).sort((a,b)=>b.out-a.out).slice(0,3).map(x=>x.d.toDateString());
  p.forEach((x,i)=>{
    if(!x.out && !x.inn) return;
    const c=x.inn>x.out?'#22c55e':'#ef4444';
    marks+=`<line x1="${f1(X(i))}" y1="${f1(Y(x.bal))}" x2="${f1(X(i))}" y2="${H-B}" stroke="${c}" stroke-width="1" opacity=".28"/>
            <circle cx="${f1(X(i))}" cy="${f1(Y(x.bal))}" r="3.2" fill="#141b24" stroke="${c}" stroke-width="1.8"/>`;
    if(x.out>0 && gros.includes(x.d.toDateString())){
      const anc=i>n-5?'end':(i<4?'start':'middle');
      marks+=`<text x="${f1(X(i))}" y="${f1(Math.max(T+10,Y(x.bal)-10))}" fill="#8da0b5" font-size="10" font-family="Inter,sans-serif" text-anchor="${anc}">−${eur0(x.out)}</text>`;
    }
  });

  // dates en bas : aujourd'hui, tous les 7 jours, fin de mois
  let lbl='';
  const idx=new Set([0,n-1]);
  const pas=n>35?14:7;
  for(let i=pas;i<n-3;i+=pas) idx.add(i);
  [...idx].sort((a,b)=>a-b).forEach(i=>{
    const anc=i===0?'start':(i===n-1?'end':'middle');
    const txt=i===0?"auj.":p[i].d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    lbl+=`<text x="${f1(X(i))}" y="${H-12}" fill="#5f7183" font-size="11" font-family="Inter,sans-serif" text-anchor="${anc}">${txt}</text>`;
  });

  // étiquette de fin de mois
  const yEnd=Math.min(H-B-12,Math.max(T+12,Y(p[n-1].bal)));
  const fin=eur0(p[n-1].bal);
  const wBox=Math.max(52,fin.length*7.6);
  const endCol=p[n-1].bal<0?'#ef4444':col;

  document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".30"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${we}
    ${gy}
    ${z>T&&z<H-B?`<line x1="${L}" y1="${f1(z)}" x2="${W-R}" y2="${f1(z)}" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/>`:''}
    <path d="${area}" fill="url(#gr)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}
    <circle cx="${f1(X(0))}" cy="${f1(Y(p[0].bal))}" r="5" fill="${col}"/>
    <circle cx="${f1(X(0))}" cy="${f1(Y(p[0].bal))}" r="9" fill="${col}" opacity=".22"/>
    <circle cx="${f1(X(n-1))}" cy="${f1(Y(p[n-1].bal))}" r="4" fill="${endCol}"/>
    <rect x="${W-R+4}" y="${f1(yEnd-11)}" width="${f1(Math.min(wBox,R-8))}" height="22" rx="6" fill="${endCol}" opacity=".16"/>
    <text x="${W-R+10}" y="${f1(yEnd+4)}" fill="${endCol}" font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">${fin}</text>
    ${lbl}</svg>
    <div class="chiplist"><i><b style="background:${col}"></b>solde projeté</i><i><b style="background:#ef4444"></b>charge</i>${m.inflows.length?`<i><b style="background:#22c55e"></b>entrée attendue</i>`:''}<i>−${eur0(m.quotidien)}/jour de train de vie</i></div>
    ${neg?`<div style="color:var(--red);font-size:12.5px;font-weight:600;padding:2px 6px 4px">⚠ Solde négatif prévu le ${neg.d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div>`:''}`;
}

      <div class="mid"><div class="t">${esc(r.nom)}</div><div class="s">${quand}${lisse}</div></div>
      <div class="amt neg">${eur(-r.montant)}</div>
      <button class="chip" style="padding:5px 9px" onclick="delRec('${r.id}','${jsq(r.nom)}')">✕</button></div>`;
  }).join('') : `<div class="empty">Ajoute loyer, crédits, assurances, abonnements.</div>`;

  const parM={};
  D.inc.forEach(i=>{ (parM[i.mois]=parM[i.mois]||[]).push(i) });
  h+=`<h2>Revenus</h2>
  <div class="two" style="margin-bottom:12px"><button class="btn" onclick="openInc()">+ Revenu</button><button class="btn" onclick="openFraisPro()">+ Frais pro</button></div>`;
  const mois=Object.keys(parM).sort().reverse();
  h+=mois.length?mois.map(k=>{
    const t=parM[k].filter(i=>!i.hors_budget).reduce((s,i)=>s+Number(i.montant_net),0);
    const p=parM[k].filter(i=>i.hors_budget).reduce((s,i)=>s+Number(i.montant_net),0);
    return `<div class="row"><div class="ic">💰</div>
      <div class="mid"><div class="t">${new Date(k+'T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div>
      <div class="s">${parM[k].map(i=>esc(i.source)).join(' + ')}${p?` · dont ${eur0(p)} hors budget`:''}</div></div>
      <div class="amt pos">${eur(t)}</div></div>`;
  }).join('') : `<div class="empty">Ton salaire varie : saisis-le chaque mois.</div>`;

  h+=`<h2>Frais pro Generali</h2>`;
  h+=(D.pro||[]).length?D.pro.map(p=>{
    const nm=new Date(p.mois+'T00:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const ic=p.statut==='sans_frais'?'—':(p.statut==='recu'?'✅':'⏳');
    let s;
    if(p.statut==='sans_frais') s='aucun frais ce mois-là';
    else if(p.statut==='recu') s=`reçu ${eur0(Number(p.montant_recu||p.montant))}`+(p.date_virement_n26?` · ${eur0(Number(p.montant_vire_n26))} virés sur N26`:' · virement N26 à saisir');
    else s=`déclaré · virement attendu le ${p.date_virement_prevue?new Date(p.date_virement_prevue+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'?'}`;
    return `<div class="row"><div class="ic">${ic}</div>
      <div class="mid"><div class="t">${nm}</div><div class="s">${s}</div></div>
      <div class="amt ${p.montant?'pos':''}">${p.montant?eur(Number(p.montant)):''}</div>
      ${p.statut==='recu'&&!p.date_virement_n26?`<button class="chip" style="padding:5px 9px" onclick="openVirN26('${p.id}')">N26</button>`:''}
      ${p.statut==='declare'?`<button class="chip" style="padding:5px 9px" onclick="openFraisPro('${p.mois}')">✎</button>`:''}</div>`;
  }).join('') : `<div class="empty">Rien encore — le rappel arrive le ${Number(D.set.jour_rappel_frais_pro||15)} du mois.</div>`;
  return h;
}

const moisISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
const proDuMois = m => (D.pro||[]).find(p=>p.mois===(m||moisISO(new Date())));
let rappelProVu=false, PRO_CONFIRM=[];

// Un seul pop-up a la fois : les rapprochements passent avant le rappel du mois.
function notifsFraisPro(){
  if(document.querySelector('.ovl')) return;
  if(PRO_CONFIRM.length) return confirmerVirementPro();
  rappelFraisPro();
}

function rappelFraisPro(){
  if(rappelProVu) return;
  const jour=new Date().getDate();
  if(jour<Number(D.set.jour_rappel_frais_pro||15)) return;
  if(proDuMois()) return;            // deja repondu pour ce mois : remise a zero le 15 suivant
  rappelProVu=true;
  const nm=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const o=sheet(`<h3>Frais pro Generali</h3>
    <div class="note" style="padding:0 0 14px">On est le ${jour}. As-tu déclaré tes frais pro de <b>${nm}</b> ?</div>

    <button class="btn" id="p_s" style="margin-top:8px">Pas de frais ce mois-ci</button>`,true);
  o.querySelector('#p_o').onclick=()=>{o.remove();openFraisPro()};
  o.querySelector('#p_t').onclick=()=>{o.remove();toast('Je te le redemande à la prochaine connexion')};

// Rapprochement du virement Generali recu avec le montant declare.
// Ecart <= tolerance : automatique. Au-dela : on demande confirmation.
async function rapprocherFraisPro(){
  PRO_CONFIRM=[];
  if(!U||!(D.pro||[]).length) return false;
  const tol=Number(D.set.frais_pro_tolerance??5);
  const persos=new Set(D.acc.filter(a=>!a.exclu_budget).map(a=>a.id));
  const lies=new Set(D.pro.map(p=>p.transaction_id).filter(Boolean));
  let maj=false;
  for(const p of D.pro){
    if(p.statut!=='declare'||!p.montant||p.transaction_id) continue;
    const ref=new Date((p.date_virement_prevue||p.date_declaration)+'T00:00:00');
    const ecartees=new Set(p.tx_ecartees||[]);
    const c=D.tx.filter(t=>Number(t.montant)>0 && !lies.has(t.id) && !ecartees.has(t.id)
        && (!t.account_id||persos.has(t.account_id))
        && Math.abs(new Date(t.date_operation+'T00:00:00')-ref)<=10*864e5
        && Number(t.montant)<=Number(p.montant)*2.5)
      .map(t=>({t,diff:Math.abs(Number(t.montant)-Number(p.montant)),
                gen:/generali/i.test((t.libelle||'')+' '+(t.contrepartie||''))?1:0}))
      .sort((a,b)=>(b.gen-a.gen)||(a.diff-b.diff));
    if(!c.length) continue;
    const best=c[0];
    if(best.diff<=tol){
      const {error}=await SB.from('frais_pro').update({statut:'recu',transaction_id:best.t.id,
        montant_recu:Number(best.t.montant),rapproche_le:new Date().toISOString()}).eq('id',p.id);
      if(!error){ maj=true; lies.add(best.t.id) }
    }else{
      PRO_CONFIRM.push({pro:p,tx:best.t});
    }
  }
  return maj;
}

function confirmerVirementPro(){
  const item=PRO_CONFIRM.shift(); if(!item) return;
  const {pro,tx}=item;
  const nm=new Date(pro.mois+'T00:00:00').toLocaleDateString('fr-FR',{month:'long'});
  const o=sheet(`<h3>Virement à rapprocher</h3>
    <div class="note" style="padding:0 0 12px">Tu avais déclaré <b>${eur(Number(pro.montant))}</b> de frais pro pour ${nm}. Ce virement correspond-il ? L'écart est de ${eur(Math.abs(Number(tx.montant)-Number(pro.montant)))}.</div>
    <div class="row"><div class="ic">💰</div><div class="mid"><div class="t">${esc(tx.libelle)}</div>
      <div class="s">${new Date(tx.date_operation+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div></div>
      <div class="amt pos">${eur(Number(tx.montant))}</div></div>
    <button class="btn primary" id="v_o" style="margin-top:14px">Oui, c'est le remboursement</button>
    <button class="btn" id="v_n" style="margin-top:8px">Non, rien à voir</button>`,true);
  o.querySelector('#v_o').onclick=async()=>{
    const {error}=await SB.from('frais_pro').update({statut:'recu',transaction_id:tx.id,
      montant_recu:Number(tx.montant),rapproche_le:new Date().toISOString()}).eq('id',pro.id);
    o.remove(); toast(error?error.message:'Rapproché ✓'); load();
  };
  o.querySelector('#v_n').onclick=async()=>{
    const {error}=await SB.from('frais_pro').update({tx_ecartees:[...(pro.tx_ecartees||[]),tx.id]}).eq('id',pro.id);
    o.remove(); if(error) toast(error.message); load();
  };
}

async function inventairePonto(){
  const {data:{session}} = await SB.auth.getSession();
  if(!session) return toast('Session expirée');
  toast('Interrogation de Ponto…');
  const r = await fetch('https://rjnysyddgpcjzmfbpyba.supabase.co/functions/v1/ponto-sync',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
    body:JSON.stringify({lister:true})});
  const j = await r.json().catch(()=>({error:'Réponse illisible'}));
  const txt = JSON.stringify(j,null,2);
  const o = sheet(`<h3>Comptes Ponto</h3>
    <div class="note" style="padding:0 0 10px">Rien n'a été écrit en base. Copie ce texte et envoie-le dans la conversation.</div>
    <textarea id="inv" readonly style="width:100%;height:46vh;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:500 12px 'JetBrains Mono',monospace">${esc(txt)}</textarea>
    <button class="btn primary" id="cp">Copier</button>`);
  o.querySelector('#cp').onclick=()=>{
    const t=o.querySelector('#inv'); t.select();
    navigator.clipboard?.writeText(t.value).then(()=>toast('Copié ✓'),()=>document.execCommand('copy'));
  };
}

let syncEnCours=false;
async function syncPonto(forcer){
  if(syncEnCours) return;
  syncEnCours=true;
  if(forcer) toast('Synchronisation en cours…');
  try{
    const {data:{session}} = await SB.auth.getSession();
    if(!session) return;
    const r = await fetch('https://rjnysyddgpcjzmfbpyba.supabase.co/functions/v1/ponto-sync',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({forcer:!!forcer})
    });
    const j = await r.json().catch(()=>({error:'Réponse illisible'}));
    if(j.error){ if(forcer) toast(j.error.slice(0,110)); return }
    if(forcer) toast(`${j.comptes} compte(s), ${j.transactions} opération(s)${j.a_valider?` · ${j.a_valider} à confirmer`:''}`);
    await load();
  }catch(e){ if(forcer) toast('Synchro impossible : '+String(e.message||e).slice(0,80)) }
  finally{ syncEnCours=false }
}
